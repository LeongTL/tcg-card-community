 * Transitions will play during the initial render unless the `intro` option is set to `false`.
 *
 * @template {Record<string, any>} Props
 * @template {Record<string, any>} Exports
 * @param {ComponentType<SvelteComponent<Props>> | Component<Props, Exports, any>} component
 * @param {MountOptions<Props>} options
 * @returns {Exports}

	return _mount(component, options);
}

/**
 * Hydrates a component on the given target and returns the exports and potentially the props (if compiled with `accessors: true`) of the component
 *
 * @template {Record<string, any>} Props
 * @template {Record<string, any>} Exports
 * @param {ComponentType<SvelteComponent<Props>> | Component<Props, Exports, any>} component
 * @param {{} extends Props ? {
 * 		target: Document | Element | ShadowRoot;
 * 		props?: Props;
 * 		events?: Record<string, (e: any) => any>;
 *  	context?: Map<any, any>;
 * 		intro?: boolean;
 * 		recover?: boolean;
 * 	} : {
 * 		target: Document | Element | ShadowRoot;
 * 		props: Props;
 * 		events?: Record<string, (e: any) => any>;
 *  	context?: Map<any, any>;
 * 		intro?: boolean;
 * 		recover?: boolean;
 * 	}} options
 * @returns {Exports}
 */

	init_operations();
	options.intro = options.intro ?? false;
	const target = options.target;
	const was_hydrating = hydrating;
	const previous_hydrate_node = hydrate_node;

	try {
		var anchor = /** @type {TemplateNode} */ (get_first_child(target));
		while (
			anchor &&
			(anchor.nodeType !== COMMENT_NODE || /** @type {Comment} */ (anchor).data !== HYDRATION_START)
		) {
			anchor = /** @type {TemplateNode} */ (get_next_sibling(anchor));
		}

		if (!anchor) {
			throw HYDRATION_ERROR;
		}

		set_hydrating(true);
		set_hydrate_node(/** @type {Comment} */ (anchor));

		const instance = _mount(component, { ...options, anchor });

		set_hydrating(false);

		return /**  @type {Exports} */ (instance);

		// re-throw Svelte errors - they are certainly not related to hydration
		if (
			error instanceof Error &&
			error.message.split('\n').some((line) => line.startsWith('https://svelte.dev/e/'))
		) {
			throw error;
		}
		if (error !== HYDRATION_ERROR) {
			// eslint-disable-next-line no-console
			console.warn('Failed to hydrate: ', error);
		}

		if (options.recover === false) {
			hydration_failed();
		}

		// If an error occurred above, the operations might not yet have been initialised.
		init_operations();
		clear_text_content(target);

		set_hydrating(false);
		return mount(component, options);
	} finally {
		set_hydrating(was_hydrating);
		set_hydrate_node(previous_hydrate_node);
	}
}

/** @type {Map<string, number>} */
const document_listeners = new Map();

/**
 * @template {Record<string, any>} Exports
 * @param {ComponentType<SvelteComponent<any>> | Component<any>} Component
 * @param {MountOptions} options
 * @returns {Exports}

			// Add the event listener to both the container and the document.
			// The container listener ensures we catch events from within in case
			// the outer content stops propagation of the event.

			var n = document_listeners.get(event_name);

			if (n === undefined) {

				// manually moved outside of the container (e.g. via manual portals).
				document.addEventListener(event_name, handle_event_propagation, { passive });
				document_listeners.set(event_name, 1);
			} else {
				document_listeners.set(event_name, n + 1);
			}
		}
	};

	event_handle(array_from(all_registered_events));
	root_event_handles.add(event_handle);

	/** @type {Exports} */
	// @ts-expect-error will be defined because the render effect runs synchronously
	var component = undefined;

	var unmount = component_root(() => {
		var anchor_node = anchor ?? target.appendChild(create_text());

		boundary(
			/** @type {TemplateNode} */ (anchor_node),
			{
				pending: () => {}
			},
			(anchor_node) => {
				if (context) {
					push({});
					var ctx = /** @type {ComponentContext} */ (component_context);
					ctx.c = context;
				}

				if (events) {

				if (hydrating) {

				component = Component(anchor_node, props) || {};

					if (
						hydrate_node === null ||
						hydrate_node.nodeType !== COMMENT_NODE ||
						/** @type {Comment} */ (hydrate_node).data !== HYDRATION_END
					) {

						throw HYDRATION_ERROR;
					}

					pop();
				}
			}

			for (var event_name of registered_events) {
				target.removeEventListener(event_name, handle_event_propagation);

				var n = /** @type {number} */ (document_listeners.get(event_name));

				if (--n === 0) {

					document_listeners.delete(event_name);
				} else {
					document_listeners.set(event_name, n);
				}
			}

			root_event_handles.delete(event_handle);

			if (anchor_node !== anchor) {
				anchor_node.parentNode?.removeChild(anchor_node);
			}
		};
	});

	return component;

/**

 *

 * import { mount, unmount } from 'svelte';
 * import App from './App.svelte';
 *
 * const app = mount(App, { target: document.body });
 *
 * // later...
 * unmount(app, { outro: true });

 * @param {{ outro?: boolean }} [options]
 * @returns {Promise<void>}

/** @import { Effect, TemplateNode } from '#client' */

/**
 * @typedef {{ effect: Effect, fragment: DocumentFragment }} Branch

/**
 * @template Key

class BranchManager {
	/** @type {TemplateNode} */
	anchor;

	/** @type {Map<Batch, Key>} */
	#batches = new Map();

	/** @type {Map<Key, Effect>} */
	#onscreen = new Map();

	/** @type {Map<Key, Branch>} */
	#offscreen = new Map();

	/**
	 * Whether to pause (i.e. outro) on change, or destroy immediately.
	 * This is necessary for `<svelte:element>`
	 */
	#transition = true;

	/**
	 * @param {TemplateNode} anchor
	 * @param {boolean} transition

		this.anchor = anchor;
		this.#transition = transition;
	}

	#commit = () => {
		var batch = /** @type {Batch} */ (current_batch);

		// if this batch was made obsolete, bail
		if (!this.#batches.has(batch)) return;

		var key = /** @type {Key} */ (this.#batches.get(batch));

		var onscreen = this.#onscreen.get(key);

		if (onscreen) {
			// effect is already in the DOM — abort any current outro
			resume_effect(onscreen);
		} else {
			// effect is currently offscreen. put it in the DOM
			var offscreen = this.#offscreen.get(key);

			if (offscreen) {
				this.#onscreen.set(key, offscreen.effect);
				this.#offscreen.delete(key);

				// remove the anchor...
				/** @type {TemplateNode} */ (offscreen.fragment.lastChild).remove();

				// ...and append the fragment
				this.anchor.before(offscreen.fragment);
				onscreen = offscreen.effect;
			}
		}

		for (const [b, k] of this.#batches) {
			this.#batches.delete(b);

			if (b === batch) {
				// keep values for newer batches
				break;
			}

			const offscreen = this.#offscreen.get(k);

			if (offscreen) {
				// for older batches, destroy offscreen effects
				// as they will never be committed
				destroy_effect(offscreen.effect);
				this.#offscreen.delete(k);
			}
		}

		// outro/destroy all onscreen effects...
		for (const [k, effect] of this.#onscreen) {
			// ...except the one that was just committed
			if (k === key) continue;

			const on_destroy = () => {
				const keys = Array.from(this.#batches.values());

				if (keys.includes(k)) {
					// keep the effect offscreen, as another batch will need it
					var fragment = document.createDocumentFragment();
					move_effect(effect, fragment);

					fragment.append(create_text()); // TODO can we avoid this?

					this.#offscreen.set(k, { effect, fragment });
				} else {
					destroy_effect(effect);
				}

				this.#onscreen.delete(k);
			};

			if (this.#transition || !onscreen) {
				pause_effect(effect, on_destroy, false);
			} else {
				on_destroy();
			}
		}
	};

	/**
	 * @param {Batch} batch
	 */
	#discard = (batch) => {
		this.#batches.delete(batch);

		const keys = Array.from(this.#batches.values());

		for (const [k, branch] of this.#offscreen) {
			if (!keys.includes(k)) {
				destroy_effect(branch.effect);
				this.#offscreen.delete(k);
			}
		}
	};

	/**
	 *
	 * @param {any} key
	 * @param {null | ((target: TemplateNode) => void)} fn
	 */
	ensure(key, fn) {
		var batch = /** @type {Batch} */ (current_batch);
		var defer = should_defer_append();

		if (fn && !this.#onscreen.has(key) && !this.#offscreen.has(key)) {
			if (defer) {
				var fragment = document.createDocumentFragment();
				var target = create_text();

				fragment.append(target);

				this.#offscreen.set(key, {
					effect: branch(() => fn(target)),
					fragment
				});
			} else {
				this.#onscreen.set(
					key,
					branch(() => fn(this.anchor))
				);
			}
		}

		this.#batches.set(batch, key);

		if (defer) {
			for (const [k, effect] of this.#onscreen) {
				if (k === key) {
					batch.skipped_effects.delete(effect);
				} else {
					batch.skipped_effects.add(effect);
				}
			}

			for (const [k, branch] of this.#offscreen) {
				if (k === key) {
					batch.skipped_effects.delete(branch.effect);
				} else {
					batch.skipped_effects.add(branch.effect);
				}
			}

			batch.oncommit(this.#commit);
			batch.ondiscard(this.#discard);
		} else {
			if (hydrating) {
				this.anchor = hydrate_node;
			}

			this.#commit();
		}
	}
}

function autoSlab(c){const h=hash(c.name);const g=['PSA','BGS','CGC'][h%3];const n=g==='PSA'?[10,9,10][h%3]:[9.5,10,9][h%3];return {g,n,label:(g==='BGS'&&n===10)?'Black Label':'',cert:String(10000000+h%89999999)}}
function gradeEditor(gr){
  const chip=(att,v,on,t)=>`<span class="chip ${on?'on':''}" data-${att}="${v}">${t||v}</span>`;
  return `<div class="mute" style="margin-top:8px">Grading company</div><div class="row" style="flex-wrap:wrap">${GRADERS.map(x=>chip('gcomp',x,gr.g===x)).join('')}</div>
   ${gr.g==='Other'?`<input id="gother" placeholder="Company name" value="${gr.o||''}" style="margin-top:6px">`:''}
   <div class="mute" style="margin-top:8px">Grade</div><div class="row" style="flex-wrap:wrap">${GRADES_FOR[gr.g].map(x=>chip('ggrade',x,gr.n===x)).join('')}</div>
   ${GLABELS[gr.g].length>1?`<div class="mute" style="margin-top:8px">Special label (optional)</div><div class="row" style="flex-wrap:wrap">${GLABELS[gr.g].map(x=>chip('glabel',x,(gr.label||'None')===x)).join('')}</div>`:''}

function valuePanel(c){
  const mg=state.shelf.includes(c.id)&&state.gr[c.id]?state.gr[c.id]:null,own=mg?gkey(mg):null;
  const sel=state.gsel[c.id]||own||'PSA 10';
  const keys=VALCHIPS.slice();if(own&&!keys.includes(own))keys.splice(keys.length-1,0,own);
  const chips=`<div class="row" style="flex-wrap:wrap;margin-bottom:8px">${keys.map(k=>`<span class="chip ${sel===k?'on':''}" data-gsel="${k}">${k}${k===own?' · yours':''}</span>`).join('')}</div>`;
  if(sel==='Raw')return chips+widget(c)+`<div class="row" style="margin-top:8px"><div class="box sp"><div class="mute">Low</div><b>${rm(c.low)}</b></div><div class="box sp"><div class="mute">Market</div><b>${rm(c.price)}</b></div><div class="box sp"><div class="mute">High</div><b>${rm(c.high)}</b></div></div><div class="mute" style="margin-top:6px">Reference price for an ungraded card, in RM.</div>`;
  const v=gval(c,sel);
  if(v.none)return chips+`<div class="box mute" style="text-align:center">No graded price for this grader yet.</div>`;
  if(v.rm==null)return chips+`<div class="box" style="text-align:center"><b>Not enough sales</b><div class="mute">Only ${v.n} recent eBay sale${v.n===1?'':'s'} for ${sel}, so no reference price is shown.</div></div>`;
  return chips+`<div class="widget"><div class="mute">${c.name} · ${sel}</div><div style="font-size:26px;font-weight:700">${rm(v.rm)}</div><div class="mute">Reference price · median of ${v.n} recent eBay sales</div><div style="margin-top:6px"><span class="chip">${(v.rm/c.price).toFixed(1)}× raw price (${rm(c.price)})</span></div></div><div class="mute" style="margin-top:6px">Graded values have no 1/7/30-day change yet.</div>`}

const SCAN_CANDS=[1,14,17,19,18,20,6,3,21];
const fxOf=c=>({SIR:'sir','Alt Art':'alt',Ultra:'ultra',Holo:'holo','Hyper Rare':'gold','Reverse Holo':'reverse','Shiny Rare':'shiny',VSTAR:'cosmos'}[c.rar]||'plain');
const FXNAME={sir:'Rainbow foil (full card)',alt:'Etched prism (alt art)',ultra:'Silver-gold sheen',holo:'Art-window holo (vintage)',gold:'Gold foil (hyper rare)',reverse:'Reverse holo (card body)',shiny:'Shiny glitter',cosmos:'Cosmos starfield',plain:'Standard gloss'};
const HOLO_SVG="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 63 88' preserveAspectRatio='none'><rect x='5' y='10.5' width='53' height='36.5' rx='1' fill='white'/></svg>";
const HOLO_MASK='url("data:image/svg+xml,'+encodeURIComponent(HOLO_SVG).replace(/'/g,'%27')+'")';
document.documentElement.style.setProperty('--holo-mask',HOLO_MASK);
const stamp=c=>c.ed1?'<div class="ed1">1</div>':'';
function cardFallback(c,big,hot){return `<div class="card ${big?'big':''} ${hot?'hot':''}" data-fx="${fxOf(c)}"><div class="nm"><span>${c.name}</span><span>HP ${c.hp}</span></div><div class="art">${c.e}</div><div class="ft"><span>${c.set} ${c.no}</span><span class="rar">${c.rar}</span></div>${stamp(c)}</div>`}
function imgFail(el){const c=card(+el.dataset.cid);el.closest('hover-tilt').firstElementChild.outerHTML=cardFallback(c,false,false)}
function cardHTML(c,{big=false,hot=false,tilt=1.2,scale=1.06,glare=1.2,hue=270,go=true}={}){
  const fx=fxOf(c);
  const inner=c.img?`<div class="card real ${hot?'hot':''}" data-fx="${fx}"><img src="${c.img}" alt="${c.name}" data-cid="${c.id}" loading="lazy" onerror="imgFail(this)">${stamp(c)}</div>`:cardFallback(c,big,hot);
  const holo=fx==='holo'?` glare-mask='${HOLO_MASK}' glare-mask-mode="alpha"`:'';
  return `<hover-tilt data-fx="${fx}" tilt-factor="${tilt*1.6}" scale-factor="${scale}" glare-intensity="${glare}" glare-hue="${hue}" blend-mode="${fx==='holo'?'hard-light':'overlay'}"${holo} shadow shadow-blur="18" ${go?`data-go="${c.id}"`:''}>${inner}</hover-tilt>`;
}
function spark(h){
  const mx=Math.max(...h),mn=Math.min(...h),w=300,ht=60;
  const pts=h.map((v,i)=>`${(i/(h.length-1))*w},${ht-4-((v-mn)/(mx-mn||1))*(ht-10)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#ff6a1a" stroke-width="2.5"/></svg>`;
}
function widget(c){
  return `<div class="widget"><div class="row"><div><div class="mute">Estimated value · widget</div><div style="font-size:22px;font-weight:700">${rm(c.price)}</div></div><div class="sp"></div><span class="chip ${c.trend>=0?'acc':''}">${c.trend>=0?'▲':'▼'} ${Math.abs(c.trend)}% 7d</span></div>${spark(c.hist)}</div>`;
}

/* ============ router / render ============ */
const FLOW=[['onboard','Onboarding'],['home','Home'],['shelf','Collectibles'],['search','Search'],['detail','Card detail'],['deal','COD deal'],['scan','Scan'],['community','Community'],['settings','Settings'],['following','Following'],['newlist','Newly listed'],['drops','Price dropped'],['collectors','Collectors']];
const TABS=[['home','🏠','Home'],['shelf','📚','Collectibles'],['scan','📷','Scan'],['community','💬','Community'],['settings','⚙️','Settings']];
function go(s,push=true){
  if(push&&state.screen!==s) state.hist.push(state.screen);
  if(s!=='shelf') state.owner=null;
  if(s==='scan') state.scan='idle';
  if(s!=='shelf') state.pv=false;
  if(s==='shelf'){state.stab=state.nextTab||'Cards';state.nextTab=null}
  state.sheet=null; state.screen=s; render();
}
function render(){
  const S=SCREENS[state.screen];
  $('#title').textContent=state.screen==='shelf'&&state.owner?state.owner+"'s Collectibles":S.title;
  $('#main').innerHTML=S.render(); $('#main').scrollTop=0;
  $('#back').style.visibility=state.hist.length?'visible':'hidden';
  $('#flow').innerHTML=FLOW.map(([k,l],n)=>`<button class="${state.screen===k?'on':''}" data-nav="${k}">${n+1} ${l}</button>`).join('');
  $('#tabs').innerHTML=S.tab===null?'':TABS.map(([k,i,l])=>`<button class="${S.tab===k?'on':''} ${k==='scan'?'ctr':''}" data-nav="${k}"><b>${i}</b>${l}</button>`).join('');
  $('#tabs').style.display=S.tab===null?'none':'flex'; renderSheet();
}
function renderSheet(){
  const sh=state.sheet,el=$('#sheet'); if(!sh){el.innerHTML='';return}
  if(sh.kind==='review'){const c=card(sh.i);
   el.innerHTML=`<div class="sheetbg" data-sheetx="1"></div><div class="sheet"><div class="grab"></div>
   <div class="row" style="margin-bottom:10px"><div style="width:54px">${cardHTML(c,{tilt:1.5,go:false})}</div><div class="sp"><b style="font-size:15px">Review ${sh.who}</b><div class="mute">${c.name} · COD deal</div></div></div>
   <div style="font-size:30px;color:var(--accent);letter-spacing:4px;text-align:center;margin-bottom:8px">${[1,2,3,4,5].map(n=>`<span data-rstar="${n}" style="cursor:pointer">${n<=sh.stars?'★':'☆'}</span>`).join('')}</div>
   <div class="row" style="flex-wrap:wrap;margin-bottom:8px">${['Fast reply','Card as described','Good packaging','On time','Friendly'].map(t=>`<span class="chip ${sh.tags.includes(t)?'on':''}" data-rtag="${t}">${t}</span>`).join('')}</div>
   <textarea id="rtxt" rows="3" placeholder="Share how the deal went…">${sh.txt||''}</textarea>
   <button class="btn pri" data-submitrev="1" style="margin-top:10px">Post review</button><button class="btn" data-sheetx="1">Cancel</button></div>`;return}
  {const a=$('#ap');if(a)sh.price=+a.value||sh.price;const ce=$('#cert'),go2=$('#gother');if(sh.gr){if(ce)sh.gr.cert=ce.value;if(go2)sh.gr.o=go2.value}}
  const c=card(sh.id);
  const O=(k,ic,t,d)=>`<div class="opt ${sh.st===k?'on':''}" data-setst="${k}"><div class="rd"></div><div class="sp"><b>${ic} ${t}</b><div class="mute">${d}</div></div></div>`;
  el.innerHTML=`<div class="sheetbg" data-sheetx="1"></div><div class="sheet"><div class="grab"></div>
   <div class="row" style="margin-bottom:12px"><div style="width:54px">${cardHTML(c,{tilt:1.5,go:false})}</div><div class="sp"><b style="font-size:15px">${c.name}</b><div class="mute">${c.set} · ${c.no}</div><div class="mute">Market ${rm(c.price)}</div></div></div>
   ${O('sell','💰','Open to sell','Listed in search &amp; Home. Collectors can contact you (COD).')}
   ${sh.st==='sell'?`<div class="box" style="margin:-2px 0 8px"><div class="mute">Asking price (RM)</div><input id="ap" type="number" value="${sh.price}" style="margin:4px 0 8px">${sh.gr?`<div class="mute">Condition: graded slab (${gbadge(sh.gr)})</div>`:`<div class="mute" style="margin-bottom:4px">Condition</div><div class="row" style="flex-wrap:wrap">${['Mint','NM','LP','MP'].map(x=>`<span class="chip ${sh.cond===x?'on':''}" data-cnd="${x}">${x}</span>`).join('')}</div>`}
     <div class="row" style="margin-top:8px;cursor:pointer" data-exch="1"><div class="sp"><b>Also open to exchange</b><div class="mute">Accept swap offers</div></div><div class="sw ${sh.ex?'on':''}"><i></i></div></div></div>`:''}
   ${O('show','👁','Showcase only','Visible on your public collectibles, not for sale.')}
   <div class="box" style="margin:8px 0"><div class="row" style="cursor:pointer" data-gtog="1"><div class="sp"><b>Graded slab</b><div class="mute">PSA, BGS, CGC… shows a grade badge</div></div><div class="sw ${sh.gr?'on':''}"><i></i></div></div>${sh.gr?gradeEditor(sh.gr)+'<div class="mute" style="margin-top:6px">Value on card detail switches to this grade.</div>':''}</div>
   <button class="btn pri" data-savesheet="1" style="margin-top:6px">Save</button><button class="btn" data-sheetx="1">Cancel</button></div>`;
}
function soft(){const y=$('#main').scrollTop;const S=SCREENS[state.screen];$('#main').innerHTML=S.render();$('#main').scrollTop=y}

/* ============ events (delegated) ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-go],[data-contact],[data-act],[data-filter],[data-chk],[data-like],[data-ctab],[data-quick],[data-dt],[data-toast],[data-owner],[data-hfilter],[data-follow],[data-toggle],[data-deal],[data-nf],[data-cf],[data-manage],[data-setst],[data-sheetx],[data-savesheet],[data-cnd],[data-exch],[data-cs],[data-pv],[data-ds],[data-stab],[data-rate],[data-rstar],[data-rtag],[data-submitrev],[data-gsel],[data-smode],[data-gtog],[data-gcomp],[data-ggrade],[data-glabel]');
  const g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('[data-contact],[data-act]')){state.card=+g.dataset.go;return go('detail')}
  if(!t)return; const d=t.dataset;
  if(d.save){state.me.name=$('#nm').value||state.me.name;state.me.city=$('#ct').value||state.me.city}
  if(d.nav) return go(d.nav, !FLOW.some(f=>f[0]===d.nav)||true);
  if(d.owner){state.owner=d.owner;return go('shelf')}
  if(d.contact!==undefined){state.seller=SELLERS[state.card][+d.contact];state.dealStep=0;state.chk=[false,false,false];
    state.chat=[{me:true,t:`Hi ${state.seller.n}, I'm interested in your ${card(state.card).name}.`},{me:false,t:'Hi! Yes, it\'s still available 👍'}];return go('deal')}
  if(d.stab){state.stab=d.stab;return soft()}
  if(d.rate!==undefined){const h=state.dealhist[+d.rate];state.sheet={kind:'review',idx:+d.rate,who:h.who,i:h.i,stars:5,tags:[]};return renderSheet()}
  if(d.rstar){const t2=$('#rtxt');state.sheet.txt=t2?t2.value:state.sheet.txt;state.sheet.stars=+d.rstar;return renderSheet()}
  if(d.rtag){const t2=$('#rtxt');state.sheet.txt=t2?t2.value:state.sheet.txt;const a=state.sheet.tags,k=a.indexOf(d.rtag);k>=0?a.splice(k,1):a.push(d.rtag);return renderSheet()}
  if(d.submitrev){const sh=state.sheet;const txt=($('#rtxt').value||'').trim()||sh.tags.join('. ')||'Smooth COD deal.';REVIEWS[sh.who]=REVIEWS[sh.who]||[];REVIEWS[sh.who].unshift({by:state.me.name,stars:sh.stars,text:txt,card:card(sh.i).name,date:'Just now'});state.dealhist[sh.idx].rev=true;state.sheet=null;renderSheet();toast('Review posted ✓');return soft()}
  if(d.gsel){state.gsel[state.card]=d.gsel;return soft()}
  if(d.smode){state.scanMode=d.smode;state.sg=null;return soft()}
  if(d.gtog||d.gcomp||d.ggrade||d.glabel){
    const GT=()=>state.sheet&&state.sheet.gr?state.sheet.gr:state.sg;
    const refresh=()=>state.sheet?renderSheet():soft();
    if(d.gtog){const sh=state.sheet;const a=$('#ap');if(a)sh.price=+a.value||sh.price;sh.gr=sh.gr?null:{g:'PSA',n:10,label:'',cert:''};if(!sh.gr&&isG(sh.cond))sh.cond='NM';return renderSheet()}
    const gr=GT();const ce=$('#cert'),go2=$('#gother');if(ce)gr.cert=ce.value;if(go2)gr.o=go2.value;
    if(d.gcomp){gr.g=d.gcomp;if(!GRADES_FOR[gr.g].includes(gr.n))gr.n=GRADES_FOR[gr.g][0];if(!GLABELS[gr.g].includes(gr.label||'None'))gr.label=''}
    if(d.ggrade)gr.n=+d.ggrade;
    if(d.glabel)gr.label=d.glabel==='None'?'':d.glabel;
    return refresh()}
  if(d.ds){state.ds=d.ds;return soft()}
  if(d.cs){state.cs2=d.cs;return soft()}
  if(d.pv){state.pv=!state.pv;return soft()}
  if(d.manage){const i=+d.manage;const mineL=SELLERS[i].find(x=>x.mine);state.sheet={id:i,st:status(i),price:askPrice(i),gr:state.gr[i]?{...state.gr[i]}:null,cond:(mineL&&!isG(mineL.cond))?mineL.cond:'NM',ex:SELLERS[i].some(x=>x.mine&&x.type==='Exchange')};return renderSheet()}
  if(d.setst){const ap=$('#ap');if(ap)state.sheet.price=+ap.value||state.sheet.price;state.sheet.st=d.setst;return renderSheet()}
  if(d.cnd){state.sheet.price=+($('#ap').value)||state.sheet.price;state.sheet.cond=d.cnd;return renderSheet()}
  if(d.exch){state.sheet.price=+($('#ap').value)||state.sheet.price;state.sheet.ex=!state.sheet.ex;return renderSheet()}
  if(d.sheetx){state.sheet=null;return renderSheet()}
  if(d.savesheet){const sh=state.sheet;const ap=$('#ap');const pr=ap?(+ap.value||sh.price):sh.price;{const ce=$('#cert'),go2=$('#gother');if(sh.gr){if(ce)sh.gr.cert=ce.value;if(go2)sh.gr.o=go2.value;state.gr[sh.id]=sh.gr}else delete state.gr[sh.id]}setStatus(sh.id,sh.st,pr,sh.gr?gbadge(sh.gr):sh.cond,sh.ex);state.sheet=null;renderSheet();toast(sh.st==='sell'?'Listed for '+rm(pr)+(sh.gr?' · '+gbadge(sh.gr):'')+' ✓':'Showing on your public collectibles');return soft()}
  if(d.nf){state.nf=d.nf;return soft()}
  if(d.cf){state.cf=d.cf;return soft()}
  if(d.follow){const n=d.follow;state.following[n]=!state.following[n];toast(state.following[n]?'Following '+n:'Unfollowed '+n);return soft()}
  if(d.toggle){state.prefs[d.toggle]=!state.prefs[d.toggle];return soft()}
  if(d.deal!==undefined){const dl=state.deals[+d.deal];state.card=dl.i;state.seller=dseller(dl);state.dealStep=dl.step;state.chk=[false,false,false];state.chat=[{me:true,t:`Hi ${state.seller.n}, I'm interested in your ${card(dl.i).name}.`},{me:false,t:'Hi! Still available 👍'}];return go('deal')}
  if(d.hfilter){state.filter=d.hfilter==='Near me'?'All':d.hfilter;return go('search')}
  if(d.filter){state.filter=d.filter;return soft()}
  if(d.chk!==undefined){state.chk[+d.chk]=!state.chk[+d.chk];return soft()}
  if(d.like){state.likes[d.like]=!state.likes[d.like];return soft()}
  if(d.ctab){state.comTab=d.ctab;return soft()}
  if(d.dt){state.dealType=d.dt;return soft()}
  if(d.toast) return toast(d.toast);
  if(d.quick){state.chat.push({me:true,t:d.quick});setTimeout(()=>{state.chat.push({me:false,t:'Sure, let\'s meet up and settle it. COD is fine.'});if(state.screen==='deal'&&state.dealStep===0)soft()},700);return soft()}
  switch(d.act){
   case 'opendeal':state.card=1;state.seller=SELLERS[1].find(x=>x.n==='KaiTCG');state.dealStep=1;state.chk=[false,false,false];state.chat=[{me:true,t:'Hi KaiTCG, I\'m interested in your Alakazam ex.'},{me:false,t:'Sure, Sunday 3 PM works.'}];return go('deal');
   case 'saveprofile':state.me.name=$('#pn').value||state.me.name;state.me.city=$('#pc').value||state.me.city;toast('Profile saved ✓');state.hist.pop();return go('settings',false);
   case 'dropbuy':{const d=PRICEDROPS[+t.dataset.di];state.card=d[0];state.seller=SELLERS[d[0]].find(x=>x.n===d[1])||SELLERS[d[0]][0];state.dealStep=0;state.chk=[false,false,false];state.chat=[{me:true,t:`Hi ${d[1]}, saw your price drop on ${card(d[0]).name} (${rm(d[3])}). Still available?`},{me:false,t:'Yes! Price is firm at '+rm(d[3])+', COD ok.'}];return go('deal')}
   case 'mydeals':state.nextTab='Deals';return go('shelf');
   case 'previewpub':state.pv=true;return go('shelf');
   case 'wanted':state.q='alakazam';state.filter='All';return go('search');
   case 'send':{const v=$('#msg').value.trim();if(v){state.chat.push({me:true,t:v});setTimeout(()=>{state.chat.push({me:false,t:'Sounds good!'});if(state.screen==='deal'&&state.dealStep===0)soft()},700);soft()}break}
   case 'next':if(state.dealStep===2&&!state.chk.every(Boolean))return toast('Tick all handover steps first');
     state.dealStep++;if(state.dealStep===3){if(!state.shelf.includes(state.card))state.shelf.push(state.card);const dk=state.deals.findIndex(d=>d.i===state.card);if(dk>=0)state.deals.splice(dk,1);state.dealhist.push({i:state.card,who:state.seller.n,role:'Bought',amt:state.seller.p,date:'Today',rev:false})}return soft();
   case 'prev':state.dealStep--;return soft();
   case 'scan':state.scan='scanning';soft();setTimeout(()=>{if(state.screen==='scan'){state.scan='found';soft()}},1800);break;
   case 'rescan':state.sg=null;state.scanIdx=(state.scanIdx||0)+1;state.scan='idle';return soft();
   case 'saveScan':{const sid=SCAN_CANDS[(state.scanIdx||0)%SCAN_CANDS.length];if(!state.shelf.includes(sid))state.shelf.unshift(sid);if(state.scanMode==='Graded slab'&&state.sg){const ce=$('#cert'),go2=$('#gother');if(ce)state.sg.cert=ce.value;if(go2)state.sg.o=go2.value;state.gr[sid]=state.sg}state.sg=null;state.scanIdx=(state.scanIdx||0)+1}toast('Saved to collectibles ✓');state.hist=[];return go('shelf',false);
   case 'msgowner':state.card=own_cards(state.owner)[0];state.seller={n:state.owner,loc:'Malaysia',p:card(state.card).price,type:'Sell'};state.dealStep=0;state.chk=[false,false,false];state.chat=[{me:true,t:`Hi ${state.owner}!`}];return go('deal');
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;const p=e.target.selectionStart;soft();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
$('#back').onclick=()=>{const p=state.hist.pop();if(p){state.screen=p;if(p!=='shelf')state.owner=null;render()}};
$('#hdrAct').onclick=()=>toast('No new notifications');
document.addEventListener('scroll',e=>{if(e.target.id==='car'){const c=e.target,n=Math.round(c.scrollLeft/(c.firstElementChild.offsetWidth+10));document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i===n))}},true);
PRICEDROPS.forEach(([i,n,o,np])=>{const L=SELLERS[i];let x=L.find(y=>y.n===n&&y.type==='Sell');if(x)x.p=np;else L.push({n,loc:LOCS[n],p:np,cond:'NM',type:'Sell'})});
Object.keys(state.cs).forEach(k=>{if(state.cs[k]==='sell')setStatus(+k,'sell',null,state.gr[k]?gbadge(state.gr[k]):'NM',false)});
render();
</script>
</body>
